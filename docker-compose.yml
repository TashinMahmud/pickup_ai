services:
  app:
    build: .
    image: ${DOCKER_USERNAME}/${PACKAGE_NAME}:${VERSION}
    container_name: pickup_ai
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pickup:pickup_secret@db:5432/pickup_ai}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: pickup_ai_db
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup_secret
      POSTGRES_DB: pickup_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
